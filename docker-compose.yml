services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--private-ip"
      - "aiconcierge-prod-sea:asia-southeast1:aiconcierge-prod-sea-db-01"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
    volumes:
      - ./avatar-chatbot-key.json:/app/credentials/gcp-key.json:ro
    expose:
      - "5432"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - cloud-sql-proxy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL_PROD}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
    volumes:
      - ./avatar-chatbot-key.json:/app/credentials/gcp-key.json:ro
    expose:
      - "8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build:
      context: ./frontend_nextjs
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    volumes:
      - ./avatar-chatbot-key.json:/app/credentials/gcp-key.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
