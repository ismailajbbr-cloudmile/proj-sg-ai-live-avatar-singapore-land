name: Deploy to GCP Compute Engine

on:
  pull_request:
    types: [closed]
    branches:
      - main # for testing
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  APP_DIR: /opt/aiconcierge

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    name: Deploy to GCP
    runs-on: ubuntu-latest
    environment: Singaporelandgroup-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install NumPy for faster IAP tunneling
        run: $(gcloud info --format="value(basic.python_location)") -m pip install numpy

      - name: Deploy code and build on server
        timeout-minutes: 60
        run: |
          # 1. Set Project Context
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}

          # 2. Prepare Directory and Fix Permissions
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo mkdir -p ${{ env.APP_DIR }} && sudo chown -R $USER:$USER ${{ env.APP_DIR }}"

          # 3. Install Docker and Docker Compose Plugin (Modern Method)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="if ! command -v docker &> /dev/null; then sudo apt-get update && sudo apt-get install -y docker.io docker-compose-v2; fi"

          # 4. Ensure Docker is running and permissions are set
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo systemctl start docker && sudo systemctl enable docker && sudo usermod -aG docker $USER"

          # 5. Stop containers, clean slate (stop first to prevent Docker recreating directory mounts)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose down --remove-orphans 2>/dev/null || true"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo rm -rf ${{ env.APP_DIR }}/.git ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/backend_fastapi/credentials ${{ env.APP_DIR }}/frontend_nextjs/credentials && sudo chmod -R u+rw ${{ env.APP_DIR }}"

          # 6. Copy code to server
          gcloud compute scp --recurse . ${{ vars.GCP_INSTANCE_NAME }}:${{ env.APP_DIR }} --tunnel-through-iap --zone=${{ vars.GCP_ZONE }}

          # 7. Fetch secrets from GCP Secret Manager (after scp so .env doesn't get overwritten)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="
            cd ${{ env.APP_DIR }}

            # Build .env with production secrets only
            > .env
            echo -n 'POSTGRES_PASSWORD=' >> .env && gcloud secrets versions access latest --secret='POSTGRES_PASSWORD' >> .env
            echo -n 'DATABASE_URL_PROD=' >> .env && gcloud secrets versions access latest --secret='DATABASE_URL_PROD' >> .env
            echo -n 'JWT_SECRET=' >> .env && gcloud secrets versions access latest --secret='JWT_SECRET' >> .env
            echo -n 'ADMIN_PASSWORD=' >> .env && gcloud secrets versions access latest --secret='ADMIN_PASSWORD' >> .env
            echo -n 'ADMIN_USERNAME=' >> .env && gcloud secrets versions access latest --secret='ADMIN_USERNAME' >> .env
            echo -n 'GOOGLE_VERTEX_PROJECT=' >> .env && gcloud secrets versions access latest --secret='GOOGLE_VERTEX_PROJECT' >> .env
            echo -n 'NEXT_PUBLIC_ORIGIN=' >> .env && gcloud secrets versions access latest --secret='NEXT_PUBLIC_ORIGIN' >> .env

            # Decode base64 GCP service account key to JSON file for Docker volume mount
            gcloud secrets versions access latest --secret='AVATAR_CHATBOT_JSON_KEY' | base64 -d > avatar-chatbot-key.json
          "

          # 8. Build (No Cache) and Start
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.yml build --no-cache"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.yml up -d"

          # 9. Clean up old images
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo docker image prune -f"
