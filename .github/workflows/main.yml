name: Deploy to GCP Compute Engine

on:
  pull_request:
    types: [closed]
    branches:
      - main # for testing
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  APP_DIR: /opt/aiconcierge

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    name: Deploy to GCP
    runs-on: ubuntu-latest
    environment: Singaporelandgroup-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy code and build on server
        timeout-minutes: 30
        run: |
          # 1. Set Project Context
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}

          # 2. Prepare Directory and Fix Permissions
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo mkdir -p ${{ env.APP_DIR }} && sudo chown -R $USER:$USER ${{ env.APP_DIR }}"

          # 3. Install Docker and Docker Compose Plugin (Modern Method)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="if ! command -v docker &> /dev/null; then sudo apt-get update && sudo apt-get install -y docker.io docker-compose-v2; fi"

          # 4. Ensure Docker is running and permissions are set
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo systemctl start docker && sudo systemctl enable docker && sudo usermod -aG docker $USER"

          # 5. Clean Slate (Remove old .git and .env to avoid conflicts)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo rm -rf ${{ env.APP_DIR }}/.git ${{ env.APP_DIR }}/.env"

          # 6. Fetch Secret and format it correctly (Fixes the @ character error)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'DB_PASSWORD=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='prod-db-password' >> ${{ env.APP_DIR }}/.env"

          # 7. Copy code to server (Excluding .git to avoid the Permission Denied error)
          # Make sure you have a .gcloudignore file in your repo!
          gcloud compute scp --recurse . ${{ vars.GCP_INSTANCE_NAME }}:${{ env.APP_DIR }} --tunnel-through-iap --zone=${{ vars.GCP_ZONE }}

          # 8. Stop existing containers, Build (No Cache), and Start
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.dev.yml down || true"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.dev.yml build --no-cache"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.dev.yml up -d"

          # 9. Clean up old images
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo docker image prune -f"
