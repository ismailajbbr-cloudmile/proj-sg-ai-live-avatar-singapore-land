name: Deploy to GCP Compute Engine

on:
  pull_request:
    types: [closed]
    branches:
      - main # for testing
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  APP_DIR: /opt/aiconcierge

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    name: Deploy to GCP
    runs-on: ubuntu-latest
    environment: Singaporelandgroup-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy code and build on server
        timeout-minutes: 30
        run: |
          # 1. Set Project Context
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}

          # 2. Prepare Directory and Fix Permissions
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo mkdir -p ${{ env.APP_DIR }} && sudo chown -R $USER:$USER ${{ env.APP_DIR }}"

          # 3. Install Docker and Docker Compose Plugin (Modern Method)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="if ! command -v docker &> /dev/null; then sudo apt-get update && sudo apt-get install -y docker.io docker-compose-v2; fi"

          # 4. Ensure Docker is running and permissions are set
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo systemctl start docker && sudo systemctl enable docker && sudo usermod -aG docker $USER"

          # 5. Stop containers, clean slate (stop first to prevent Docker recreating directory mounts)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose down --remove-orphans 2>/dev/null || true"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo rm -rf ${{ env.APP_DIR }}/.git ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/backend_fastapi/credentials ${{ env.APP_DIR }}/frontend_nextjs/credentials && sudo chmod -R u+rw ${{ env.APP_DIR }}"

          # 6. Fetch Secret and format it correctly (Fixes the @ character error)
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'POSTGRES_PASSWORD=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='POSTGRES_PASSWORD' >> ${{ env.APP_DIR }}/.env"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'DATABASE_URL=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='DATABASE_URL' >> ${{ env.APP_DIR }}/.env"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'DATABASE_URL_DOCKER=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='DATABASE_URL_DOCKER' >> ${{ env.APP_DIR }}/.env"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'DATABASE_URL_PROD=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='DATABASE_URL_PROD' >> ${{ env.APP_DIR }}/.env"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'JWT_SECRET=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='JWT_SECRET' >> ${{ env.APP_DIR }}/.env"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'ADMIN_PASSWORD=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='ADMIN_PASSWORD' >> ${{ env.APP_DIR }}/.env"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="echo -n 'AVATAR_CHATBOT_JSON_KEY=' > ${{ env.APP_DIR }}/.env && gcloud secrets versions access latest --secret='AVATAR_CHATBOT_JSON_KEY' >> ${{ env.APP_DIR }}/.env"
          
          # 7. Remove files that should not be uploaded (key file already lives on VM)
          rm -f avatar-chatbot-key.json

          # 8. Copy code to server
          gcloud compute scp --recurse . ${{ vars.GCP_INSTANCE_NAME }}:${{ env.APP_DIR }} --tunnel-through-iap --zone=${{ vars.GCP_ZONE }}

          # 9. Build (No Cache) and Start
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.yml build --no-cache"
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="cd ${{ env.APP_DIR }} && sudo docker compose -f docker-compose.yml up -d"

          # 10. Clean up old images
          gcloud compute ssh ${{ vars.GCP_INSTANCE_NAME }} --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --command="sudo docker image prune -f"
