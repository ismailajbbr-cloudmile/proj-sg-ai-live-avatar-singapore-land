[project]
name = "avatar-chatbot-backend"
version = "0.1.0"
description = "Avatar Chatbot FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "google-cloud-texttospeech>=2.21.0",
    "google-auth>=2.36.0",
    "google-genai>=1.0.0",
    "google-cloud-discoveryengine>=0.13.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "watchfiles>=1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "live: calls Alibaba Model Studio with DASHSCOPE_API_KEY from the repo .env",
]
