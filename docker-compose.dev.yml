services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: avatar_chatbot
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d avatar_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend_fastapi/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://avatar:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/avatar_chatbot
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
    volumes:
      - ./backend_fastapi:/app
      # Preserve the .venv installed at image build time — prevents source mount from overwriting it
      - /app/.venv
      - ./frontend_nextjs/avatar-chatbot-key.json:/app/credentials/gcp-key.json:ro
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build:
      context: ./frontend_nextjs
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    env_file:
      - ./frontend_nextjs/.env.local
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend_nextjs:/app
      - /app/node_modules
      - ./frontend_nextjs/avatar-chatbot-key.json:/app/credentials/gcp-key.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev:
