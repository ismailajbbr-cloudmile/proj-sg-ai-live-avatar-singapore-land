services:
  frontend:
    build:
      context: ./frontend_nextjs
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend_nextjs/.env.local
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
      # Required for hot reload on Docker Desktop (Mac/Windows use a VM;
      # inotify events don't cross the boundary, so Next.js needs polling).
      WATCHPACK_POLLING: "true"
    volumes:
      # Mount source code into the container
      - ./frontend_nextjs:/app
      # Keep the container's node_modules — prevents host dir from overwriting it
      - /app/node_modules
      - ./frontend_nextjs/avatar-chatbot-key.json:/app/credentials/gcp-key.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
