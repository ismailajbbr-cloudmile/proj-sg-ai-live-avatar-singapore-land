services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/application_default_credentials.json
      WATCHFILES_FORCE_POLLING: "1"
    volumes:
      - ./backend_fastapi:/app
      # Preserve the .venv installed at image build time — prevents source mount from overwriting it
      - /app/.venv
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/credentials/application_default_credentials.json:ro
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build:
      context: ./frontend_nextjs
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/application_default_credentials.json
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend_nextjs:/app
      - /app/node_modules
      # Keep dev build output out of the host .next — a host `npm run build`
      # leaves production artifacts that wedge `next dev` at 'Compiling middleware'
      - /app/.next
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/credentials/application_default_credentials.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev:
